# =============================================================================
# ESAI-v3 Quick Test Configuration - Fast Lambda Ramp
# For debugging/testing - NOT for paper experiments
# =============================================================================

# Model Architecture
iae_dim: 32
hidden_dim: 128
num_agents: 1

# Feature Flags
attention: true
heb_read_to_forecast: true
diffusion: false
use_alignment_regret: true

# IAE Dynamics
gamma_E: 0.9
alpha_diffusion: 0.05

# Alignment Loss - FAST RAMP FOR TESTING
lambda_reg: 5.0
lambda_warmup_steps: 1000      # REDUCED from 50000
lambda_ramp_steps: 5000        # REDUCED from 100000

kappa: 0.05

# Softmin temperature annealing
tau_init: 1.0
tau_min: 0.01
tau_decay_steps: 10000         # REDUCED

# Bias Suppression
lambda_bias: 0.0

# Hebbian Memory
eta_H: 0.001
delta_H: 0.02
lambda_H: 0.001

# PPO
clip_epsilon: 0.2
value_coef: 0.5
max_grad_norm: 0.5

# Entropy
entropy_coef: 0.02
entropy_coef_init: 0.02
entropy_coef_final: 0.005
entropy_decay_steps: 10000     # REDUCED

# Optimizer
lr: 0.0003
forecaster_lr: 0.001

# Rollout
rollout_length: 2048
ppo_epochs: 4
minibatch_size: 64
gamma: 0.99
gae_lambda: 0.95
