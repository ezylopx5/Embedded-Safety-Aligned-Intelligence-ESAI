# CPO baseline (Constrained Policy Optimization proxy)

iae_dim: 32
hidden_dim: 128

gamma_E: 0.5  # Reduced IAE dynamics
alpha_diffusion: 0.0

attention: false
heb_read_to_forecast: false
diffusion: false
use_alignment_regret: true  # Uses alignment as constraint

lambda_reg: 0.5  # Higher constraint penalty
lambda_H: 0.0
lambda_D: 0.0
lambda_bias: 0.0

tau_init: 1.0
tau_min: 0.1
tau_decay_steps: 300000

ema_tau: 0.995

lr: 0.0003
clip_epsilon: 0.2
entropy_coef: 0.01
gamma: 0.99
gae_lambda: 0.95
batch_size: 64
save_every_steps: 100000