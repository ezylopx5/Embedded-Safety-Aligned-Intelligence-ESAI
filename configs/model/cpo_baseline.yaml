# CPO baseline (Constrained Policy Optimization proxy)
# Uses alignment regret as constraint BUT without ESAI adaptive mechanisms

iae_dim: 32
hidden_dim: 128
num_agents: 1

# IAE disabled - just constraint-based
gamma_E: 0.0
alpha_diffusion: 0.0

# No adaptive mechanisms (key difference from ESAI)
attention: false
heb_read_to_forecast: false
diffusion: false
use_alignment_regret: true  # Uses alignment as fixed constraint

# Fixed penalty (no scheduling - key difference from ESAI)
lambda_reg: 2.0             # Same final value as ESAI
lambda_warmup_steps: 0      # NO warmup (immediate penalty)
lambda_ramp_steps: 0        # NO ramp (fixed from start)

lambda_H: 0.0
lambda_D: 0.0
lambda_bias: 0.0

# Temperature (same as ESAI)
tau_init: 1.0
tau_min: 0.01
tau_decay_steps: 300000

ema_tau: 0.995

# PPO settings (match ESAI for fair comparison)
lr: 0.0003
clip_epsilon: 0.2
gamma: 0.99
gae_lambda: 0.95
value_coef: 0.5
max_grad_norm: 1.0

# Entropy (match ESAI)
entropy_coef_init: 0.02
entropy_coef_final: 0.005
entropy_decay_steps: 200000

# Training (match ESAI)
batch_size: 128
num_epochs: 10
rollout_length: 2048

# Stability
iae_max_norm: 10.0
ar_max: 50.0
reward_scaling: 1.0

save_every_steps: 50000