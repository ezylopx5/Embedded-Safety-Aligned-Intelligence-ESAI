# =============================================================================
# ESAI-v3 Model Configuration - A100 GPU Optimized
# =============================================================================
# Optimized for NVIDIA A100 (80GB) with larger batch sizes and rollout lengths
# Expected speedup: 3-5x compared to default config on A100

# -----------------------------------------------------------------------------
# Model Architecture (same as default)
# -----------------------------------------------------------------------------
iae_dim: 32
hidden_dim: 128
num_agents: 1

# -----------------------------------------------------------------------------
# Feature Flags
# -----------------------------------------------------------------------------
attention: true
heb_read_to_forecast: true
diffusion: false
use_alignment_regret: true

# -----------------------------------------------------------------------------
# IAE Dynamics
# -----------------------------------------------------------------------------
gamma_E: 0.9
alpha_diffusion: 0.05

# -----------------------------------------------------------------------------
# Alignment Loss (with scheduling)
# -----------------------------------------------------------------------------
lambda_reg: 1.0                # Stronger alignment penalty for visible effect
lambda_warmup_steps: 50000
lambda_ramp_steps: 100000

kappa: 0.05

# Softmin temperature annealing
tau_init: 1.0
tau_min: 0.01
tau_decay_steps: 300000

# -----------------------------------------------------------------------------
# Bias Suppression
# -----------------------------------------------------------------------------
lambda_bias: 0.0

# -----------------------------------------------------------------------------
# Hebbian Memory
# -----------------------------------------------------------------------------
eta_H: 0.001
delta_H: 0.02
lambda_H: 0.001

# -----------------------------------------------------------------------------
# PPO Hyperparameters
# -----------------------------------------------------------------------------
lr: 0.0003
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
max_grad_norm: 1.0

# Entropy (with scheduling)
entropy_coef_init: 0.02
entropy_coef_final: 0.005
entropy_decay_steps: 200000

# -----------------------------------------------------------------------------
# Training - A100 OPTIMIZED
# -----------------------------------------------------------------------------
batch_size: 512            # 4x larger than default (128) - better GPU utilization
num_epochs: 10
rollout_length: 8192       # 4x larger than default (2048) - more data per update
ema_tau: 0.995

# -----------------------------------------------------------------------------
# Stability Safeguards
# -----------------------------------------------------------------------------
iae_max_norm: 10.0
ar_max: 50.0
reward_scaling: 1.0
value_clip: true

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
log_interval: 1000
eval_interval: 25000
eval_episodes: 50
save_interval: 50000
