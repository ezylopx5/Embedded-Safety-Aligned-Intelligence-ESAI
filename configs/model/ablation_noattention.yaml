# =============================================================================
# Ablation: ESAI-v3 WITHOUT Attention Gating
# =============================================================================

iae_dim: 32
hidden_dim: 128
num_agents: 1

# Feature flags
attention: false              # DISABLED for ablation
heb_read_to_forecast: true
diffusion: false
use_alignment_regret: true

# IAE dynamics (same as ESAI)
gamma_E: 0.9
alpha_diffusion: 0.05

# Alignment (same as ESAI)
lambda_reg: 2
lambda_warmup_steps: 50000
lambda_ramp_steps: 100000
kappa: 0.05

tau_init: 1.0
tau_min: 0.01
tau_decay_steps: 300000

lambda_bias: 0.0

# Hebbian (same as ESAI)
eta_H: 0.001
delta_H: 0.02
lambda_H: 0.001

# PPO (same as ESAI)
lr: 0.0003
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
max_grad_norm: 1.0

entropy_coef_init: 0.02
entropy_coef_final: 0.005
entropy_decay_steps: 200000

batch_size: 128
num_epochs: 10
rollout_length: 2048
ema_tau: 0.995

iae_max_norm: 10.0
ar_max: 50.0
reward_scaling: 1.0

save_interval: 50000