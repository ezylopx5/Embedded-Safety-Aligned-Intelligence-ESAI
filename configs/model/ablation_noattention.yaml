# ESAI-v3 without attention gating

iae_dim: 32
hidden_dim: 128
identity_dim: 8

gamma_E: 0.9
alpha_diffusion: 0.1

attention: false  # DISABLED
heb_read_to_forecast: true
diffusion: true
use_alignment_regret: true

lambda_reg: 0.2
lambda_H: 0.001
lambda_D: 0.01
lambda_bias: 0.0

tau_init: 1.0
tau_min: 0.05
tau_decay_steps: 300000

ema_tau: 0.995

lr: 0.0003
clip_epsilon: 0.2
entropy_coef: 0.01
gamma: 0.99
gae_lambda: 0.95
batch_size: 64
save_every_steps: 100000