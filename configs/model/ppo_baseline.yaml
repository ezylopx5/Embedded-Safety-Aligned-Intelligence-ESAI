# PPO baseline (no alignment modules)

iae_dim: 32
hidden_dim: 128

gamma_E: 0.0
alpha_diffusion: 0.0

attention: false
heb_read_to_forecast: false
diffusion: false
use_alignment_regret: false

lambda_reg: 0.0
lambda_H: 0.0
lambda_D: 0.0
lambda_bias: 0.0

# ==== match ESAI training settings ====
lr: 0.0003
clip_epsilon: 0.2
entropy_coef: 0.02      # <-- match ESAI
gamma: 0.99
gae_lambda: 0.95

batch_size: 128         # <-- match ESAI
num_epochs: 10          # <-- match ESAI

save_every_steps: 100000