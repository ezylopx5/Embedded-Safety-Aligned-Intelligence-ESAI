# =============================================================================
# ESAI-v3 Model Configuration (Cleaned)
# =============================================================================

# -----------------------------------------------------------------------------
# Model Architecture
# -----------------------------------------------------------------------------
iae_dim: 32
hidden_dim: 128
num_agents: 1

# -----------------------------------------------------------------------------
# Feature Flags
# -----------------------------------------------------------------------------
attention: true
heb_read_to_forecast: true
diffusion: false               # Set false for single-agent
use_alignment_regret: true

# -----------------------------------------------------------------------------
# IAE Dynamics
# -----------------------------------------------------------------------------
gamma_E: 0.9
alpha_diffusion: 0.05

# -----------------------------------------------------------------------------
# Alignment Loss (with scheduling)
# -----------------------------------------------------------------------------
lambda_reg: 2               # Final value after warmup+ramp
lambda_warmup_steps: 50000     # Steps with λ=0 (learn task first)
lambda_ramp_steps: 100000      # Steps to ramp 0 → lambda_reg

kappa: 0.05                    # Neighbor harm weight

# Softmin temperature annealing
tau_init: 1.0
tau_min: 0.01
tau_decay_steps: 300000

# -----------------------------------------------------------------------------
# Bias Suppression
# -----------------------------------------------------------------------------
lambda_bias: 0.0

# -----------------------------------------------------------------------------
# Hebbian Memory
# -----------------------------------------------------------------------------
eta_H: 0.001
delta_H: 0.02
lambda_H: 0.001

# -----------------------------------------------------------------------------
# PPO Hyperparameters
# -----------------------------------------------------------------------------
lr: 0.0003
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
value_coef: 0.5
max_grad_norm: 1.0

# Entropy (with scheduling)
entropy_coef_init: 0.02
entropy_coef_final: 0.005
entropy_decay_steps: 200000

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
batch_size: 128
num_epochs: 10
rollout_length: 2048
ema_tau: 0.995

# -----------------------------------------------------------------------------
# Stability Safeguards
# -----------------------------------------------------------------------------
iae_max_norm: 10.0
ar_max: 50.0
reward_scaling: 1.0
value_clip: true

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
log_interval: 1000
eval_interval: 25000
eval_episodes: 50
save_interval: 50000